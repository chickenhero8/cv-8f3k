<style>
:root{--bg:#f4f5f8;--panel:#fff;--text:#1b1d24;--sub:#6b7280;--line:#e3e5eb;--accent:#2f5bea;--danger:#d93025;--ok:#1e8e3e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#1a1d24;--text:#eceef3;--sub:#9aa1b0;--line:#2a2e38;--accent:#6b8cff;--danger:#ff6b60;--ok:#5bd37c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 16px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;background:var(--bg)}
header b{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .l{font-size:20px;font-weight:700;text-align:left}
button{font:inherit;color:var(--accent);background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer}
button:active{opacity:.6}
button.primary{background:var(--accent);color:#fff;width:100%;padding:13px;font-weight:600;margin-top:8px}
button.primary:disabled{opacity:.5}
button.danger{color:var(--danger)}
button.outline{border:1px solid var(--line);background:var(--panel);width:100%;padding:12px;margin-top:8px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:4px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
label{display:block;margin:12px 0;font-size:13px;color:var(--sub)}
.center{padding-top:10vh;text-align:center}
.center h1{font-size:26px;margin:0 0 4px}
.center form{text-align:left;margin-top:24px}
.sub{color:var(--sub);font-size:14px;margin:4px 0}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:20px;text-align:center}
.note{font-size:12.5px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:14px 0}
.or{color:var(--sub);font-size:13px;margin:22px 0 -10px}
.cardtile{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;color:var(--fg,#fff);border-radius:16px;padding:10px 16px;min-height:76px;margin:0 0 10px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 4px 14px rgba(0,0,0,.18)}
.cardtile .n{font-size:18px;font-weight:700;word-break:break-all}
.cardtile .l4{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;margin-left:10px;font-size:14px}
.cardtile .b{font-size:13px;opacity:.9;margin-top:2px}
.cardtile .d{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;margin-top:14px;font-size:14px;opacity:.95}
.cardtile .tl{min-width:0;flex:1}
.cardtile .thumb{flex:none;width:84px;aspect-ratio:1.586;object-fit:cover;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.empty{text-align:center;color:var(--sub);padding:56px 0}
.rrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;margin:0 0 8px}
.rrow .rn{flex:1;min-width:0;display:flex;flex-direction:column}
.rrow .rn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rrow .mv{width:48px;height:44px;margin:0;padding:0;font-size:18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--accent)}

.reo{width:100%;margin:0 0 12px}

.tools{display:flex;gap:8px;margin:0 0 12px}
.tools input{flex:1;min-width:0;margin-top:0}
.tools select{width:auto;max-width:46%;margin-top:0}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;line-height:1;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.wstack{--w:min(calc(100vw - 32px),528px);--h:calc(var(--w) / 1.586);padding-top:4px}
.wcard{display:flex;flex-direction:column;justify-content:space-between;width:100%;height:var(--h);text-align:left;color:var(--fg,#fff);border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 -3px 12px rgba(0,0,0,.45);position:relative}
.wstack .wcard+.wcard{margin-top:calc(76px - var(--h))}
.wcard .wt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;height:48px;flex:none}
.wcard .wl{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.wcard .wn{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wcard .w4{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.04em;opacity:.92;white-space:nowrap;flex:none}
.wcard .wb{font-size:12px;opacity:.9;white-space:nowrap;padding-top:3px}
.wcard .wimg{display:flex;flex:1;min-height:0;margin-top:28px;justify-content:center;align-items:center}
.wcard .wimg img{height:100%;max-width:100%;object-fit:contain;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.wcard{transition:opacity .15s,transform .15s,box-shadow .15s;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-y}
.wcard img{pointer-events:none;-webkit-user-drag:none}
.wstack.holding .wcard:not(.pop){opacity:.12}
.wcard.pop{opacity:1!important;z-index:5;transform:translateY(-8px) scale(1.03);box-shadow:0 14px 32px rgba(0,0,0,.5)}
.wcard.raised{z-index:5;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.wm{position:absolute;left:14px;top:6px;font-size:58px;line-height:1.1;font-weight:800;color:var(--fg,#fff);opacity:.24;pointer-events:none;z-index:0}
.wcard,.cardtile,.cprev{position:relative;overflow:hidden}
.wcard{z-index:0;isolation:isolate}
.wcard>*:not(.wm),.cardtile>*:not(.wm),.cprev>*:not(.wm){position:relative;z-index:1}
.cardtile .tl,.wcard .wt,.cprev .pn{padding-left:56px}
.cardtile .tl{box-sizing:border-box}
.hexrow{display:flex;gap:10px;align-items:center;margin:8px 0}
.hexrow .hx{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);flex:none}
.hexrow input{flex:1;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.cprev{border-radius:12px;padding:12px 14px;color:var(--fg,#fff);font-weight:700;background:linear-gradient(135deg,var(--a),var(--b));margin:6px 0 10px;word-break:break-all}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 4px;margin:6px 0 4px}
.pi{display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 0;color:var(--text);font-size:11px;line-height:1.2;text-align:center}
.pi .dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line)}
.pi.on .dot{outline:3px solid var(--accent);outline-offset:2px}
.sl label{margin:10px 0}
input[type=range]{-webkit-appearance:none;appearance:none;height:30px;padding:0;border:0;border-radius:0;background:transparent;margin-top:6px}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--trk,#ccc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #9aa1b0;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-top:-8px}
input[type=range]::-moz-range-track{height:12px;border-radius:6px;background:var(--trk,#ccc)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #9aa1b0}
@media (hover:hover){.wcard:hover~.wcard{opacity:.12}}
.wcard.solo{height:auto;box-shadow:0 8px 24px rgba(0,0,0,.45);margin:4px 0 12px}
.seg{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;color:var(--text);padding:10px}
.seg button.on{background:var(--accent);color:#fff}
.field{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.field small{color:var(--sub);font-size:12px}
.val{font-family:ui-monospace,Menlo,monospace;font-size:17px;word-break:break-all}
.btns{display:flex;gap:2px;flex-shrink:0}
.btns .copy{background:var(--accent);color:#fff;padding:8px 14px;font-weight:600}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.imgs figure{margin:0}
.imgs figcaption{font-size:12px;color:var(--sub);margin-bottom:4px}
.imgs img,.imgpick img,.ph{width:100%;max-width:100%;height:auto;aspect-ratio:1.586;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:block}
.ph{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.imgpick .box{min-width:0;margin-bottom:0;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center}
.imgpick .box button{padding:4px 8px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:50}
#toast.on{opacity:.95}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
h3{font-size:14px;color:var(--sub);margin:24px 0 4px;font-weight:600}

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="lb"><img alt=""></div>
<input id="pick-front" type="file" accept="image/*" hidden>
<input id="pick-back" type="file" accept="image/*" hidden>
<input id="imp" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
/* ====== ユーティリティ ====== */
const $=s=>document.querySelector(s);
const enc=new TextEncoder(),dec=new TextDecoder();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rid=()=>b64(crypto.getRandomValues(new Uint8Array(9))).replace(/[+/=]/g,'x');
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));

/* ====== 暗号 ======
   データ鍵(DEK, ランダム256bit)でデータを AES-GCM 暗号化。
   DEK は ①パスワード由来の鍵(PBKDF2) ②パスキー(Face ID)由来の鍵(WebAuthn PRF) のどちらでも解錠できるよう、
   それぞれで包んで(wrap)保存する。平文の鍵・パスワードは保存しない。 */
const ITER=600000;
const KUSE=['encrypt','decrypt','wrapKey','unwrapKey'];
async function derive(pw,salt,iter){
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,KUSE);
}
async function prfKey(buf){
  const km=await crypto.subtle.importKey('raw',buf,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:enc.encode('card-vault-prf-v1'),info:enc.encode('kek')},km,{name:'AES-GCM',length:256},false,KUSE);
}
const newDEK=()=>crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
async function wrapDEK(dek,kek){
  const iv=rnd(12);
  const ct=await crypto.subtle.wrapKey('raw',dek,kek,{name:'AES-GCM',iv});
  return{iv:b64(iv),ct:b64(ct)};
}
function unwrapDEK(w,kek){
  return crypto.subtle.unwrapKey('raw',unb64(w.ct),kek,{name:'AES-GCM',iv:unb64(w.iv)},{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
async function seal(key,obj){
  const iv=rnd(12);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return{iv:b64(iv),ct:b64(ct)};
}
async function open(key,rec){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},key,unb64(rec.ct));
  return JSON.parse(dec.decode(pt));
}

/* ====== 保存 (IndexedDB / 暗号化済みデータのみ) ====== */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('cardvault',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbDel(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

/* ====== 状態 ====== */
let key=null,meta=null,vault=null;   // key = DEK
let view={name:'boot'};
let lastView='';
let fails=0,lockUntil=0;
let pkCache=null;      // 保存済みパスキー情報（Face ID ボタンの表示用）
let pendingPk=null;
let frontId='';                       // ウォレット風：長押しで最前面にしたカード
let hold={t:null,el:null,x:0,y:0,on:false,end:0};
let theme='classic';
try{theme=localStorage.getItem('cv-theme')==='wallet'?'wallet':'classic'}catch{}
function applyTheme(t){
  theme=t;
  try{localStorage.setItem('cv-theme',t)}catch{}
  document.documentElement.classList.toggle('wallet',t==='wallet');
}

async function persist(){
  const s=await seal(key,vault);
  await dbSet('vault',{v:2,salt:b64(meta.salt),iter:meta.iter,wrap:meta.wrap,pk:meta.pk||null,...s});
}

/* ====== ブランド・並び替え ====== */
const BRANDS=['Visa','Mastercard','JCB','American Express','Diners Club','Discover','UnionPay','その他'];
const BCOL={'Visa':['#1a3a8f','#2f6bd6'],'Mastercard':['#b3261e','#e8801f'],'JCB':['#0b5e3a','#2aa66b'],'American Express':['#1d6f8f','#4ab3d4'],'Diners Club':['#3d4350','#8a8f98'],'Discover':['#c85a00','#f2a03d'],'UnionPay':['#8c1c2b','#1f6f6b'],'その他':['#4b4f58','#7c8190']};
const PAL=[['#e53935','赤'],['#fb8c00','オレンジ'],['#fdd835','黄'],['#43a047','緑'],['#29b6f6','水色'],['#1e4fd8','青'],['#8e24aa','紫'],['#ec407a','ピンク'],['#6d4c41','茶'],['#1c1c1c','黒']];
function ini(n){const ch=Array.from(String(n||'').trim())[0];return ch?ch.toUpperCase():''}
function wm(n){const i=ini(n);return i?`<span class="wm" aria-hidden="true">${esc(i)}</span>`:''}
const HEX=/^#[0-9a-fA-F]{6}$/;
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=p<0?0:255,q=Math.abs(p);
  r=Math.round((t-r)*q+r);g=Math.round((t-g)*q+g);b=Math.round((t-b)*q+b);
  return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function lum(hex){const n=parseInt(hex.slice(1),16);return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255}
function cardColors(c){
  if(HEX.test(c.color||''))return[shade(c.color,-.08),shade(c.color,.10),lum(c.color)>.62?'#1b1d24':'#fff'];
  const x=BCOL[c.brand]||BCOL['その他'];return[x[0],x[1],'#fff'];
}
function hsl2hex(h,s,l){
  s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const x=v=>Math.round(255*v).toString(16).padStart(2,'0');
  return'#'+x(f(0))+x(f(8))+x(f(4));
}
function hex2hsl(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,l=(max+min)/2;
  let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));
    if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;
    h*=60;if(h<0)h+=360}
  return[Math.round(h),Math.round(s*100),Math.round(l*100)];
}
function hslOf(d){
  if(!HEX.test(d.color||''))return[210,60,82];
  const[h,s,l]=hex2hsl(d.color);return[h,s,Math.max(20,Math.min(95,l))];
}
const SORTS=[['added','登録順'],['added-desc','登録が新しい順'],['name','カード名順'],['brand','ブランド順'],['exp','有効期限が近い順'],['manual','自分で並べ替え']];
function sortCards(list){
  const s=vault.sort||'added',c=[...list];
  const nm=(a,b)=>(a.name||'').localeCompare(b.name||'','ja');
  const ex=x=>{const m=/^(\d\d)\/(\d\d)$/.exec(x.exp||'');return m?(+m[2])*100+(+m[1]):1e9};
  if(s==='added-desc')c.reverse();
  else if(s==='name')c.sort(nm);
  else if(s==='brand')c.sort((a,b)=>BRANDS.indexOf(a.brand)-BRANDS.indexOf(b.brand)||nm(a,b));
  else if(s==='manual'){const o=vault.order||[];const ix=x=>{const i=o.indexOf(x.id);return i<0?1e6:i};c.sort((a,b)=>ix(a)-ix(b))}
  else if(s==='exp')c.sort((a,b)=>ex(a)-ex(b)||nm(a,b));
  return c;
}
function detect(n){
  if(!n)return'';
  const p=(k)=>+n.slice(0,k);
  if(/^3[47]/.test(n))return'American Express';
  if(p(4)>=3528&&p(4)<=3589)return'JCB';
  if(/^(30[0-5]|36|38|39)/.test(n))return'Diners Club';
  if(/^(6011|65|64[4-9])/.test(n))return'Discover';
  if(/^62/.test(n))return'UnionPay';
  if(/^5[1-5]/.test(n)||(p(4)>=2221&&p(4)<=2720))return'Mastercard';
  if(/^4/.test(n))return'Visa';
  return'';
}
function fmtNum(n){
  n=(n||'').replace(/\D/g,'');
  if(/^3[47]/.test(n))return[n.slice(0,4),n.slice(4,10),n.slice(10,15)].filter(Boolean).join(' ');
  return n.replace(/(.{4})/g,'$1 ').trim();
}
const maskNum=n=>n?(n.length>=4?'•••• •••• •••• '+n.slice(-4):'••••'):'未登録';

/* ====== クリップボード (30秒後に消去を試みる) ====== */
let clipTimer;
async function clipWrite(t){
  try{await navigator.clipboard.writeText(t)}
  catch{const e=document.createElement('textarea');e.value=t;e.style.cssText='position:fixed;opacity:0';document.body.appendChild(e);e.select();document.execCommand('copy');e.remove()}
}
async function copy(text,label){
  await clipWrite(text);
  toast(label+'をコピーしました（30秒後にクリア）');
  clearTimeout(clipTimer);
  clipTimer=setTimeout(()=>clipWrite(' ').catch(()=>{}),30000);
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ====== ロック ====== */
let idleT;
function bump(){clearTimeout(idleT);if(key)idleT=setTimeout(lock,120000)}
['pointerdown','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,bump,{passive:true,capture:true}));
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)hiddenAt=Date.now();
  else if(key&&Date.now()-hiddenAt>60000)lock();
});
function lock(){
  key=null;vault=null;meta=null;pendingPk=null;frontId='';clearTimeout(idleT);
  $('#lb').classList.remove('on');
  view={name:'lock'};render();
}

/* ====== パスキー (Face ID) ====== */
const pkSupported=()=>!!(window.PublicKeyCredential&&navigator.credentials);
async function prfEval(credId,salt){
  const a=await navigator.credentials.get({publicKey:{
    challenge:rnd(32),rpId:location.hostname,
    allowCredentials:[{type:'public-key',id:credId}],
    userVerification:'required',
    extensions:{prf:{eval:{first:salt}}}}});
  const r=a.getClientExtensionResults().prf;
  if(!r||!r.results||!r.results.first)throw new Error('noprf');
  return r.results.first;
}
function pkErr(e){
  if(e&&e.name==='NotAllowedError')return'キャンセルされました';
  if(e&&e.message==='noprf')return'この環境はFace ID解除に対応していません';
  return'Face IDで処理できませんでした';
}
async function enablePasskey(){
  const salt=rnd(32);
  const cred=await navigator.credentials.create({publicKey:{
    rp:{name:'カード金庫',id:location.hostname},
    user:{id:rnd(16),name:'card-vault',displayName:'カード金庫'},
    challenge:rnd(32),
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{residentKey:'required',userVerification:'required'},
    extensions:{prf:{eval:{first:salt}}}}});
  const r=cred.getClientExtensionResults().prf;
  if(!r||r.enabled===false)throw new Error('noprf');
  if(r.results&&r.results.first){await finishPk(cred.rawId,salt,r.results.first)}
  else{pendingPk={id:cred.rawId,salt};view.pkPending=true;render()}
}
async function finishPk(rawId,salt,out){
  const kek=await prfKey(out);
  const wrap=await wrapDEK(key,kek);
  meta.pk={id:b64(rawId),salt:b64(salt),wrap};
  await persist();pkCache=meta.pk;pendingPk=null;view.pkPending=false;render();
  toast('Face IDで開けるようになりました');
}
async function faceUnlock(){
  const info=pkCache;if(!info)return;
  try{
    const out=await prfEval(unb64(info.id),unb64(info.salt));
    const kek=await prfKey(out);
    const rec=await dbGet('vault');
    if(!rec||rec.v!==2||!rec.pk)throw new Error('x');
    const dek=await unwrapDEK(rec.pk.wrap,kek);
    const v=await open(dek,rec);
    key=dek;meta={salt:unb64(rec.salt),iter:rec.iter,wrap:rec.wrap,pk:rec.pk};vault=v;
    fails=0;view={name:'list',q:''};bump();render();
  }catch(e){toast(pkErr(e))}
}

/* ====== 画像 ====== */
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const M=1200,s=Math.min(1,M/Math.max(img.width,img.height));
      const w=Math.round(img.width*s),h=Math.round(img.height*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}

/* ====== 画面 ====== */
function render(){
  const a=$('#app');
  const old=a.querySelector('.scroll'),st=old?old.scrollTop:0;
  const same=view.name===lastView;lastView=view.name;
  switch(view.name){
    case'setup':a.innerHTML=setupHTML();break;
    case'lock':a.innerHTML=lockHTML();break;
    case'list':a.innerHTML=listHTML();break;
    case'detail':a.innerHTML=detailHTML();break;
    case'edit':a.innerHTML=editHTML();break;
    case'settings':a.innerHTML=settingsHTML();break;
    case'reorder':a.innerHTML=reorderHTML();break;
    default:a.innerHTML='';
  }
  const h=a.querySelector('header');
  const sc=document.createElement('div');sc.className='scroll';
  Array.from(a.childNodes).filter(n=>n!==h).forEach(n=>sc.appendChild(n));
  a.appendChild(sc);
  sc.scrollTop=same?st:0;
  const f=sc.querySelector('[autofocus]');if(f)f.focus();
}

/* ====== 操作 ====== */
function newDraft(c){return c?{name:c.name,brand:c.brand,number:c.number||'',exp:c.exp||'',cvv:c.cvv||'',front:c.front||'',back:c.back||'',color:c.color||''}:{name:'',brand:'Visa',number:'',exp:'',cvv:'',front:'',back:'',color:''}}
function collectForm(){
  const d=view.draft;
  d.name=$('#f-name').value.trim();d.brand=$('#f-brand').value;
  d.number=$('#f-number').value.replace(/\D/g,'');d.exp=$('#f-exp').value.trim();d.cvv=$('#f-cvv').value.replace(/\D/g,'');
}
const setErr=m=>{const e=$('#err');if(e)e.textContent=m};

document.addEventListener('click',async e=>{
  /* ウォレット風：カード以外の場所をタップすると、手前に出していたカードを元に戻す */
  if(view.name==='list'&&frontId&&Date.now()-hold.end>600&&!e.target.closest('.wcard,.tools,header,.fab')){
    frontId='';const l=$('#cardlist');if(l)l.innerHTML=listBody();
  }
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act;
  try{
  switch(act){
    case'faceid':await faceUnlock();break;
    case'theme':applyTheme(t.dataset.v==='wallet'?'wallet':'classic');render();break;
    case'lock':lock();break;
    case'settings':view={name:'settings'};render();break;
    case'reorder':
      if(vault.cards.length<2){toast('カードが2枚以上あると並べ替えできます');break}
      if(vault.sort!=='manual'){vault.order=sortCards(vault.cards).map(c=>c.id);vault.sort='manual';await persist()}
      view={name:'reorder'};render();break;
    case'mv':{
      const ord=sortCards(vault.cards).map(c=>c.id),i=ord.indexOf(t.dataset.id),j=i+(+t.dataset.d);
      if(i>=0&&j>=0&&j<ord.length){[ord[i],ord[j]]=[ord[j],ord[i]];vault.order=ord;await persist();render()}
      break}
    case'back':view={name:'list',q:''};render();break;
    case'add':view={name:'edit',id:null,draft:newDraft(),brandTouched:false};render();break;
    case'open':
      if(Date.now()-hold.end<600)break;   /* 長押しを離した直後のクリックは無視 */
      view={name:'detail',id:t.dataset.id,reveal:{}};render();break;
    case'edit':view={name:'edit',id:view.id,draft:newDraft(curCard()),brandTouched:true};render();break;
    case'cancel':view=view.id?{name:'detail',id:view.id,reveal:{}}:{name:'list',q:''};render();break;
    case'reveal':view.reveal[t.dataset.f]=!view.reveal[t.dataset.f];render();break;
    case'copy':{
      const c=curCard(),f=t.dataset.f;
      await copy(c[f],{number:'カード番号',exp:'有効期限',cvv:'セキュリティコード'}[f]);break;}
    case'zoom':$('#lb img').src=t.src;$('#lb').classList.add('on');break;
    case'pick':collectForm();$('#pick-'+t.dataset.side).click();break;
    case'clearimg':collectForm();view.draft[t.dataset.side]='';render();break;
    case'color':collectForm();view.draft.color=t.dataset.v;render();break;
    case'delete':
      if(confirm('このカードを削除しますか？この操作は取り消せません。')){
        vault.cards=vault.cards.filter(c=>c.id!==view.id);await persist();view={name:'list',q:''};render();toast('削除しました');}
      break;
    case'enablepk':
      try{await enablePasskey()}catch(er){toast(pkErr(er))}
      break;
    case'finishpk':
      try{const p=pendingPk;const out=await prfEval(p.id,p.salt);await finishPk(p.id,p.salt,out)}catch(er){toast(pkErr(er))}
      break;
    case'disablepk':
      if(confirm('Face IDでの解除を無効にしますか？（パスワードでは開けます）')){
        meta.pk=null;await persist();pkCache=null;view.pkPending=false;render();toast('無効にしました');}
      break;
    case'export':{
      const rec=await dbGet('vault');
      const text=JSON.stringify(rec);
      const fname='card-vault-backup-'+new Date().toISOString().slice(0,10)+'.json';
      const blob=new Blob([text],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=fname;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
      toast('書き出しました');break;}
    case'import':$('#imp').click();break;
    case'wipe':
      if(confirm('すべてのカード情報と設定を削除します。元に戻せません。よろしいですか？')&&confirm('本当に削除しますか？')){
        await dbDel('vault');key=null;vault=null;meta=null;pkCache=null;view={name:'setup'};render();}
      break;
  }
  }catch(err){toast('エラーが発生しました')}
});
/* ウォレット風：長押しで他のカードを透過し、離すとそのカードを最前面にする */
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest&&e.target.closest('.wstack .wcard');
  if(!el||view.name!=='list')return;
  clearTimeout(hold.t);
  hold={t:null,el,x:e.clientX,y:e.clientY,on:false,end:hold.end};
  hold.t=setTimeout(()=>{
    hold.on=true;
    const st=el.closest('.wstack');if(st)st.classList.add('holding');
    el.classList.add('pop');
    try{if(navigator.vibrate)navigator.vibrate(10)}catch{}
  },420);
});
document.addEventListener('pointermove',e=>{
  if(hold.t&&!hold.on&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>10){clearTimeout(hold.t);hold.t=null;hold.el=null}
});
function endHold(commit){
  clearTimeout(hold.t);hold.t=null;
  if(!hold.on){hold.el=null;return}
  const id=hold.el&&hold.el.dataset.id;
  hold.on=false;hold.el=null;hold.end=Date.now();
  if(commit&&id)frontId=id;
  const l=$('#cardlist');if(l)l.innerHTML=listBody();
}
document.addEventListener('pointerup',()=>endHold(true));
document.addEventListener('pointercancel',()=>endHold(false));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.wcard'))e.preventDefault()});
$('#lb').addEventListener('click',()=>{$('#lb').classList.remove('on');$('#lb img').src=''});

/* 入力欄の自動移動：名前(Enter)→番号(桁数が揃うと)→有効期限(4桁で)→セキュリティコード */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const id=e.target&&e.target.id;
  const next={'f-name':'f-number','f-number':'f-exp','f-exp':'f-cvv'}[id];
  if(next){e.preventDefault();const n=$('#'+next);if(n)n.focus()}
  else if(id==='f-cvv'){e.preventDefault();e.target.blur()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){view.q=t.value;const l=$('#cardlist');if(l)l.innerHTML=listBody()}
  else if(/^c-[hsl]$/.test(t.id)){
    const h=+$('#c-h').value,sa=+$('#c-s').value,l=+$('#c-l').value;
    const hex=hsl2hex(h,sa,l);view.draft.color=hex;
    const cc=cardColors({color:hex}),p=$('#cprev');
    if(p){p.style.setProperty('--a',cc[0]);p.style.setProperty('--b',cc[1]);p.style.setProperty('--fg',cc[2])}
    $('#c-s').style.setProperty('--trk','linear-gradient(90deg,hsl('+h+',0%,'+l+'%),hsl('+h+',100%,'+l+'%))');
    $('#c-l').style.setProperty('--trk','linear-gradient(90deg,hsl('+h+','+sa+'%,20%),hsl('+h+','+sa+'%,95%))');
    document.querySelectorAll('.pal .pi').forEach(x=>x.classList.remove('on'));
    const hf=$('#c-hex');if(hf)hf.value=hex.toUpperCase();const hs=$('#hxs');if(hs)hs.style.background=hex;
  }
  else if(t.id==='c-hex'){
    let v=t.value.trim().replace(/^#?/,'#');
    if(/^#[0-9a-fA-F]{3}$/.test(v))v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
    if(HEX.test(v)){
      v=v.toLowerCase();view.draft.color=v;
      const cc=cardColors({color:v}),p=$('#cprev');
      if(p){p.style.setProperty('--a',cc[0]);p.style.setProperty('--b',cc[1]);p.style.setProperty('--fg',cc[2])}
      const hs=$('#hxs');if(hs)hs.style.background=v;
      const[h,sa,l]=hslOf({color:v});
      $('#c-h').value=h;$('#c-s').value=sa;$('#c-l').value=l;
      document.querySelectorAll('.pal .pi').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
    }
  }
  else if(t.id==='f-number'){
    const n=t.value.replace(/\D/g,'').slice(0,19);t.value=fmtNum(n);
    if(!view.brandTouched){const b=detect(n);if(b)$('#f-brand').value=b}
    const br=$('#f-brand').value,want=br==='American Express'?15:br==='Diners Club'?14:br==='UnionPay'?0:16;
    if(want&&n.length===want&&e.inputType&&e.inputType.startsWith('insert')&&t.selectionStart===t.value.length)$('#f-exp').focus();
  }else if(t.id==='f-exp'){
    let v=t.value.replace(/\D/g,'').slice(0,4);
    if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);t.value=v;
    if(v.length===5&&e.inputType&&e.inputType.startsWith('insert'))$('#f-cvv').focus();
  }else if(t.id==='f-cvv'){
    t.value=t.value.replace(/\D/g,'').slice(0,4);
    const need=$('#f-brand').value==='American Express'?4:3;
    if(t.value.length===need&&e.inputType&&e.inputType.startsWith('insert'))t.blur();
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='f-brand'){view.brandTouched=true}
  else if(t.id==='sort'){
    try{const first=t.value==='manual'&&!vault.order;if(first)vault.order=sortCards(vault.cards).map(c=>c.id);vault.sort=t.value;frontId='';await persist();if(t.value==='manual'){view={name:'reorder'}}render()}catch{toast('エラーが発生しました')}
  }
  else if(t.id==='pick-front'||t.id==='pick-back'){
    const side=t.id==='pick-front'?'front':'back',f=t.files[0];t.value='';
    if(!f)return;
    try{view.draft[side]=await fileToDataURL(f);render();}catch{toast('画像を読み込めませんでした')}
  }else if(t.id==='imp'){
    const f=t.files[0];t.value='';if(!f)return;
    try{
      const rec=JSON.parse(await f.text());
      const okS=x=>typeof x==='string'&&x.length>0;
      const okW=w=>w&&okS(w.iv)&&okS(w.ct);
      if(!rec||!okS(rec.salt)||!okS(rec.iv)||!okS(rec.ct)||!Number.isInteger(rec.iter)||rec.iter<100000||rec.iter>3000000)throw 0;
      const v2=rec.v===2;
      if(v2&&!okW(rec.wrap))throw 0;
      let pk=null;
      if(v2&&rec.pk){
        if(!okS(rec.pk.id)||!okS(rec.pk.salt)||!okW(rec.pk.wrap))throw 0;
        pk={id:rec.pk.id,salt:rec.pk.salt,wrap:{iv:rec.pk.wrap.iv,ct:rec.pk.wrap.ct}};
      }
      const out=v2?{v:2,salt:rec.salt,iter:rec.iter,wrap:{iv:rec.wrap.iv,ct:rec.wrap.ct},pk,iv:rec.iv,ct:rec.ct}
                  :{v:1,salt:rec.salt,iter:rec.iter,iv:rec.iv,ct:rec.ct};
      if(!confirm('現在のデータをバックアップの内容で置き換えます。読み込み後は、バックアップ作成時のパスワードが必要になります。続行しますか？'))return;
      await dbSet('vault',out);pkCache=pk;
      lock();toast('読み込みました。バックアップのパスワードで解除してください');
    }catch{toast('バックアップファイルが正しくありません')}
  }
});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const id=e.target.id;
  try{
  if(id==='setupform'){
    const a=$('#pw1').value,b=$('#pw2').value;
    if(a.length<8)return setErr('8文字以上にしてください');
    if(a!==b)return setErr('確認用パスワードが一致しません');
    const btn=$('#setupbtn');btn.disabled=true;btn.textContent='鍵を生成中…';
    const salt=rnd(16),kek=await derive(a,salt,ITER);
    key=await newDEK();
    meta={salt,iter:ITER,wrap:await wrapDEK(key,kek),pk:null};
    vault={cards:[],sort:'added'};await persist();pkCache=null;
    view={name:'list',q:''};bump();render();
  }else if(id==='unlockform'){
    const wait=lockUntil-Date.now();
    if(wait>0)return setErr(Math.ceil(wait/1000)+'秒後にもう一度お試しください');
    const pw=$('#pw').value,btn=$('#unlockbtn'),label=btn.textContent;
    btn.disabled=true;btn.textContent='確認中…';
    try{
      const rec=await dbGet('vault');
      const salt=unb64(rec.salt),kek=await derive(pw,salt,rec.iter);
      if(rec.v===2){
        const dek=await unwrapDEK(rec.wrap,kek);
        const v=await open(dek,rec);
        key=dek;meta={salt,iter:rec.iter,wrap:rec.wrap,pk:rec.pk||null};vault=v;
      }else{
        /* 旧形式(v1)：パスワード由来の鍵で直接暗号化されていたデータを新形式へ移行 */
        const v=await open(kek,rec);
        const dek=await newDEK();
        key=dek;meta={salt,iter:rec.iter,wrap:await wrapDEK(dek,kek),pk:null};vault=v;
        await persist();
      }
      pkCache=meta.pk;
      fails=0;view={name:'list',q:''};bump();render();
    }catch{
      key=null;meta=null;vault=null;
      fails++;lockUntil=Date.now()+Math.min(fails*2000,30000);
      btn.disabled=false;btn.textContent=label;$('#pw').value='';
      setErr('パスワードが違います');
    }
  }else if(id==='cardform'){
    collectForm();const d=view.draft;
    if(!d.name)return setErr('カード名を入力してください');
    if(d.number&&(d.number.length<12||d.number.length>19))return setErr('カード番号は12〜19桁で入力してください');
    if(d.exp&&!/^(0[1-9]|1[0-2])\/\d{2}$/.test(d.exp))return setErr('有効期限は MM/YY 形式で入力してください');
    if(d.cvv&&(d.cvv.length<3))return setErr('セキュリティコードは3〜4桁です');
    let id2=view.id;
    if(id2){Object.assign(curCard(),d,{updated:Date.now()})}
    else{id2=rid();vault.cards.push({id:id2,...d,updated:Date.now()})}
    await persist();view={name:'detail',id:id2,reveal:{}};render();toast('保存しました');
  }else if(id==='pwform'){
    const cur=$('#cur').value,n1=$('#n1').value,n2=$('#n2').value;
    if(n1.length<8)return setErr('新しいパスワードは8文字以上にしてください');
    if(n1!==n2)return setErr('確認用パスワードが一致しません');
    const btn=$('#pwbtn');btn.disabled=true;btn.textContent='処理中…';
    try{
      const rec=await dbGet('vault');
      const kek=await derive(cur,unb64(rec.salt),rec.iter);
      await unwrapDEK(rec.wrap,kek);
      const salt=rnd(16),nk=await derive(n1,salt,ITER);
      meta.salt=salt;meta.iter=ITER;meta.wrap=await wrapDEK(key,nk);
      await persist();
      toast('パスワードを変更しました');view={name:'list',q:''};render();
    }catch{btn.disabled=false;btn.textContent='変更する';setErr('現在のパスワードが違います')}
  }
  }catch(err){toast('エラーが発生しました')}
});

/* ====== 起動 ====== */
(async()=>{
  if(!window.crypto||!crypto.subtle||!window.indexedDB){
    $('#app').innerHTML='<div class="center"><h1>非対応の環境です</h1><p class="sub">Web Crypto と IndexedDB が使えるブラウザ（Chrome / Edge / Safari / Firefox の最新版）で開いてください。</p></div>';return;
  }
  applyTheme(theme);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
  try{const rec=await dbGet('vault');pkCache=(rec&&rec.v===2&&rec.pk)||null;view={name:rec?'lock':'setup'}}catch{view={name:'setup'}}
  render();
})();
</script>
</body>
</html>
