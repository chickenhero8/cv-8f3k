<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="カード金庫">
<meta name="theme-color" content="#2f5bea">
<title>カード金庫</title>
<style>
:root{--bg:#f4f5f8;--panel:#fff;--text:#1b1d24;--sub:#6b7280;--line:#e3e5eb;--accent:#2f5bea;--danger:#d93025;--ok:#1e8e3e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#1a1d24;--text:#eceef3;--sub:#9aa1b0;--line:#2a2e38;--accent:#6b8cff;--danger:#ff6b60;--ok:#5bd37c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0;position:sticky;top:0;background:var(--bg);z-index:5}
header b{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .l{font-size:20px;font-weight:700;text-align:left}
button{font:inherit;color:var(--accent);background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer}
button:active{opacity:.6}
button.primary{background:var(--accent);color:#fff;width:100%;padding:13px;font-weight:600;margin-top:8px}
button.primary:disabled{opacity:.5}
button.danger{color:var(--danger)}
button.outline{border:1px solid var(--line);background:var(--panel);width:100%;padding:12px;margin-top:8px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:4px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
label{display:block;margin:12px 0;font-size:13px;color:var(--sub)}
.center{padding-top:14vh;text-align:center}
.center h1{font-size:26px;margin:0 0 4px}
.center form{text-align:left;margin-top:24px}
.sub{color:var(--sub);font-size:14px;margin:4px 0}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:20px;text-align:center}
.note{font-size:12.5px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:14px 0}
.cardtile{display:block;width:100%;text-align:left;color:#fff;border-radius:16px;padding:16px 18px;margin:0 0 12px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 4px 14px rgba(0,0,0,.18)}
.cardtile .n{font-size:18px;font-weight:700;word-break:break-all}
.cardtile .b{font-size:13px;opacity:.9;margin-top:2px}
.cardtile .d{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;margin-top:14px;font-size:14px;opacity:.95}
.empty{text-align:center;color:var(--sub);padding:56px 0}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;line-height:1;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.field{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.field small{color:var(--sub);font-size:12px}
.val{font-family:ui-monospace,Menlo,monospace;font-size:17px;word-break:break-all}
.btns{display:flex;gap:2px;flex-shrink:0}
.btns .copy{background:var(--accent);color:#fff;padding:8px 14px;font-weight:600}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.imgs figure{margin:0}
.imgs figcaption{font-size:12px;color:var(--sub);margin-bottom:4px}
.imgs img,.ph{width:100%;aspect-ratio:1.586;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:block}
.ph{display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.imgpick .box{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center}
.imgpick .box button{padding:4px 8px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:50}
#toast.on{opacity:.95}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:10px}
h3{font-size:14px;color:var(--sub);margin:24px 0 4px;font-weight:600}
.search{margin:0 0 14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="lb"><img alt=""></div>
<input id="pick-front" type="file" accept="image/*" hidden>
<input id="pick-back" type="file" accept="image/*" hidden>
<input id="imp" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
/* ====== ユーティリティ ====== */
const $=s=>document.querySelector(s);
const enc=new TextEncoder(),dec=new TextDecoder();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rid=()=>b64(crypto.getRandomValues(new Uint8Array(9))).replace(/[+/=]/g,'x');

/* ====== 暗号 (PBKDF2-SHA256 → AES-256-GCM / すべて端末内) ====== */
const ITER=600000;
async function derive(pw,salt,iter){
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return{iv:b64(iv),ct:b64(ct)};
}
async function open(key,rec){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(rec.iv)},key,unb64(rec.ct));
  return JSON.parse(dec.decode(pt));
}

/* ====== 保存 (IndexedDB / 暗号化済みデータのみ) ====== */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('cardvault',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbGet(k){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbDel(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

/* ====== 状態 ====== */
let key=null,meta=null,vault=null;
let view={name:'boot'};
let fails=0,lockUntil=0;

async function persist(){
  const s=await seal(key,vault);
  await dbSet('vault',{v:1,salt:b64(meta.salt),iter:meta.iter,...s});
}

/* ====== ブランド ====== */
const BRANDS=['Visa','Mastercard','JCB','American Express','Diners Club','Discover','UnionPay','その他'];
const BCOL={'Visa':['#1a3a8f','#2f6bd6'],'Mastercard':['#b3261e','#e8801f'],'JCB':['#0b5e3a','#2aa66b'],'American Express':['#1d6f8f','#4ab3d4'],'Diners Club':['#3d4350','#8a8f98'],'Discover':['#c85a00','#f2a03d'],'UnionPay':['#8c1c2b','#1f6f6b'],'その他':['#4b4f58','#7c8190']};
function detect(n){
  if(!n)return'';
  const p=(k)=>+n.slice(0,k);
  if(/^3[47]/.test(n))return'American Express';
  if(p(4)>=3528&&p(4)<=3589)return'JCB';
  if(/^(30[0-5]|36|38|39)/.test(n))return'Diners Club';
  if(/^(6011|65|64[4-9])/.test(n))return'Discover';
  if(/^62/.test(n))return'UnionPay';
  if(/^5[1-5]/.test(n)||(p(4)>=2221&&p(4)<=2720))return'Mastercard';
  if(/^4/.test(n))return'Visa';
  return'';
}
function fmtNum(n){
  n=(n||'').replace(/\D/g,'');
  if(/^3[47]/.test(n))return[n.slice(0,4),n.slice(4,10),n.slice(10,15)].filter(Boolean).join(' ');
  return n.replace(/(.{4})/g,'$1 ').trim();
}
const maskNum=n=>n?(n.length>=4?'•••• •••• •••• '+n.slice(-4):'••••'):'未登録';

/* ====== クリップボード (30秒後に消去を試みる) ====== */
let clipTimer;
async function clipWrite(t){
  try{await navigator.clipboard.writeText(t)}
  catch{const e=document.createElement('textarea');e.value=t;e.style.cssText='position:fixed;opacity:0';document.body.appendChild(e);e.select();document.execCommand('copy');e.remove()}
}
async function copy(text,label){
  await clipWrite(text);
  toast(label+'をコピーしました（30秒後にクリア）');
  clearTimeout(clipTimer);
  clipTimer=setTimeout(()=>clipWrite(' ').catch(()=>{}),30000);
}
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ====== ロック ====== */
let idleT;
function bump(){clearTimeout(idleT);if(key)idleT=setTimeout(lock,120000)}
['pointerdown','keydown','touchstart','scroll'].forEach(e=>addEventListener(e,bump,{passive:true}));
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)hiddenAt=Date.now();
  else if(key&&Date.now()-hiddenAt>60000)lock();
});
function lock(){
  key=null;vault=null;meta=null;clearTimeout(idleT);
  $('#lb').classList.remove('on');
  view={name:'lock'};render();
}

/* ====== 画像 ====== */
function fileToDataURL(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const M=1200,s=Math.min(1,M/Math.max(img.width,img.height));
      const w=Math.round(img.width*s),h=Math.round(img.height*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.85));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}

/* ====== 画面 ====== */
function render(){
  const a=$('#app');
  switch(view.name){
    case'setup':a.innerHTML=setupHTML();break;
    case'lock':a.innerHTML=lockHTML();break;
    case'list':a.innerHTML=listHTML();break;
    case'detail':a.innerHTML=detailHTML();break;
    case'edit':a.innerHTML=editHTML();break;
    case'settings':a.innerHTML=settingsHTML();break;
    default:a.innerHTML='';
  }
  const f=a.querySelector('[autofocus]');if(f)f.focus();
}

function setupHTML(){return`<div class="center"><h1>🔐 カード金庫</h1>
<p class="sub">はじめにマスターパスワードを設定します</p>
<form id="setupform">
<label>パスワード（12文字以上を推奨）<input id="pw1" type="password" autocomplete="new-password" autofocus></label>
<label>パスワード（確認）<input id="pw2" type="password" autocomplete="new-password"></label>
<div class="note">パスワードを忘れるとデータは復元できません。データはこの端末のブラウザ内でのみ暗号化保存され、外部へは一切送信されません。</div>
<button class="primary" id="setupbtn">設定して開始</button>
<div class="err" id="err"></div></form></div>`}

function lockHTML(){return`<div class="center"><h1>🔒 カード金庫</h1>
<p class="sub">パスワードを入力してください</p>
<form id="unlockform"><input id="pw" type="password" autocomplete="current-password" placeholder="マスターパスワード" autofocus>
<button class="primary" id="unlockbtn">ロック解除</button>
<div class="err" id="err"></div></form></div>`}

function listHTML(){
  const q=(view.q||'').toLowerCase();
  const cards=vault.cards.filter(c=>!q||(c.name+' '+c.brand).toLowerCase().includes(q));
  return`<header><span class="l">カード一覧</span><span><button data-act="settings">設定</button><button data-act="lock">ロック</button></span></header>
${vault.cards.length>3?`<input class="search" id="q" placeholder="検索" value="${esc(view.q||'')}">`:''}
${cards.length?cards.map(tile).join(''):`<div class="empty">${vault.cards.length?'該当なし':'カードがまだありません<br>右下の＋から追加できます'}</div>`}
<button class="fab" data-act="add" aria-label="追加">＋</button>`;
}
function tile(c){const[a,b]=BCOL[c.brand]||BCOL['その他'];
  return`<button class="cardtile" data-act="open" data-id="${esc(c.id)}" style="--a:${a};--b:${b}"><div class="n">${esc(c.name)}</div><div class="b">${esc(c.brand)}</div><div class="d">${esc(maskNum(c.number))}</div></button>`}

function curCard(){return vault.cards.find(c=>c.id===view.id)}
function detailHTML(){
  const c=curCard();if(!c){view={name:'list'};return listHTML()}
  const r=view.reveal||{};
  const [a,b]=BCOL[c.brand]||BCOL['その他'];
  const row=(label,f,disp,has,canHide)=>`<div class="field"><div><small>${label}</small><div class="val">${esc(disp)}</div></div><div class="btns">${canHide&&has?`<button data-act="reveal" data-f="${f}">${r[f]?'隠す':'表示'}</button>`:''}${has?`<button class="copy" data-act="copy" data-f="${f}">コピー</button>`:''}</div></div>`;
  const img=(src,cap)=>src?`<figure><figcaption>${cap}</figcaption><img src="${src}" alt="${cap}" data-act="zoom"></figure>`:`<figure><figcaption>${cap}</figcaption><div class="ph">未登録</div></figure>`;
  return`<header><button data-act="back">‹ 戻る</button><b>${esc(c.name)}</b><button data-act="edit">編集</button></header>
<div class="cardtile" style="--a:${a};--b:${b};cursor:default"><div class="n">${esc(c.name)}</div><div class="b">${esc(c.brand)}</div></div>
<div class="imgs">${img(c.front,'表面')}${img(c.back,'裏面')}</div>
${row('カード番号','number',c.number?(r.number?fmtNum(c.number):maskNum(c.number)):'未登録',!!c.number,true)}
${row('有効期限','exp',c.exp||'未登録',!!c.exp,false)}
${row('セキュリティコード','cvv',c.cvv?(r.cvv?c.cvv:'•'.repeat(c.cvv.length)):'未登録',!!c.cvv,true)}`;
}

function editHTML(){
  const d=view.draft;
  const prev=(s,cap)=>s?`<img src="${s}" alt="${cap}">`:`<div class="ph">${cap}</div>`;
  return`<header><button data-act="cancel">キャンセル</button><b>${view.id?'カードを編集':'カードを追加'}</b><span></span></header>
<form id="cardform" autocomplete="off">
<label>カード名<input id="f-name" value="${esc(d.name)}" maxlength="50" placeholder="例：楽天カード" autocomplete="off"></label>
<label>ブランド<select id="f-brand">${BRANDS.map(b=>`<option ${b===d.brand?'selected':''}>${b}</option>`).join('')}</select></label>
<label>カード番号<input id="f-number" inputmode="numeric" autocomplete="off" maxlength="23" value="${esc(fmtNum(d.number))}"></label>
<div class="row2">
<label>有効期限（MM/YY）<input id="f-exp" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="MM/YY" value="${esc(d.exp)}"></label>
<label>セキュリティコード<input id="f-cvv" inputmode="numeric" autocomplete="off" maxlength="4" value="${esc(d.cvv)}"></label>
</div>
<h3>カード画像</h3>
<div class="imgpick">
<div class="box"><div id="prev-front">${prev(d.front,'表面')}</div><button type="button" data-act="pick" data-side="front">表面を撮影/選択</button>${d.front?`<button type="button" class="danger" data-act="clearimg" data-side="front">削除</button>`:''}</div>
<div class="box"><div id="prev-back">${prev(d.back,'裏面')}</div><button type="button" data-act="pick" data-side="back">裏面を撮影/選択</button>${d.back?`<button type="button" class="danger" data-act="clearimg" data-side="back">削除</button>`:''}</div>
</div>
<div class="err" id="err"></div>
<button class="primary" id="savebtn">保存</button>
${view.id?`<button type="button" class="outline danger" data-act="delete">このカードを削除</button>`:''}
</form>`;
}

function settingsHTML(){return`<header><button data-act="back">‹ 戻る</button><b>設定</b><span></span></header>
<h3>マスターパスワードの変更</h3>
<form id="pwform">
<label>現在のパスワード<input id="cur" type="password" autocomplete="current-password"></label>
<label>新しいパスワード<input id="n1" type="password" autocomplete="new-password"></label>
<label>新しいパスワード（確認）<input id="n2" type="password" autocomplete="new-password"></label>
<button class="primary" id="pwbtn">変更する</button><div class="err" id="err"></div></form>
<h3>バックアップ（暗号化されたまま保存）</h3>
<button class="outline" data-act="export">バックアップを書き出す</button>
<button class="outline" data-act="import">バックアップを読み込む</button>
<div class="note">バックアップファイルは暗号化されており、書き出し時のパスワードがないと開けません。読み込むと現在のデータは置き換えられます。</div>
<h3>危険な操作</h3>
<button class="outline danger" data-act="wipe">すべてのデータを削除</button>
<div class="note">通信はCSPで完全に遮断されています。自動ロック：操作なし2分／アプリから離れて1分。コピーした内容は30秒後にクリアを試みます。</div>`}

/* ====== 操作 ====== */
function newDraft(c){return c?{name:c.name,brand:c.brand,number:c.number||'',exp:c.exp||'',cvv:c.cvv||'',front:c.front||'',back:c.back||''}:{name:'',brand:'Visa',number:'',exp:'',cvv:'',front:'',back:''}}
function collectForm(){
  const d=view.draft;
  d.name=$('#f-name').value.trim();d.brand=$('#f-brand').value;
  d.number=$('#f-number').value.replace(/\D/g,'');d.exp=$('#f-exp').value.trim();d.cvv=$('#f-cvv').value.replace(/\D/g,'');
}
const setErr=m=>{const e=$('#err');if(e)e.textContent=m};

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act;
  try{
  switch(act){
    case'lock':lock();break;
    case'settings':view={name:'settings'};render();break;
    case'back':view=view.name==='settings'?{name:'list',q:''}:view.name==='detail'?{name:'list',q:''}:view;render();break;
    case'add':view={name:'edit',id:null,draft:newDraft(),brandTouched:false};render();break;
    case'open':view={name:'detail',id:t.dataset.id,reveal:{}};render();break;
    case'edit':view={name:'edit',id:view.id,draft:newDraft(curCard()),brandTouched:true};render();break;
    case'cancel':view=view.id?{name:'detail',id:view.id,reveal:{}}:{name:'list',q:''};render();break;
    case'reveal':view.reveal[t.dataset.f]=!view.reveal[t.dataset.f];render();break;
    case'copy':{
      const c=curCard(),f=t.dataset.f;
      await copy(c[f],{number:'カード番号',exp:'有効期限',cvv:'セキュリティコード'}[f]);break;}
    case'zoom':$('#lb img').src=t.src;$('#lb').classList.add('on');break;
    case'pick':collectForm();$('#pick-'+t.dataset.side).click();break;
    case'clearimg':collectForm();view.draft[t.dataset.side]='';render();break;
    case'delete':
      if(confirm('このカードを削除しますか？この操作は取り消せません。')){
        vault.cards=vault.cards.filter(c=>c.id!==view.id);await persist();view={name:'list',q:''};render();toast('削除しました');}
      break;
    case'export':{
      const rec=await dbGet('vault');
      const text=JSON.stringify(rec);
      const fname='card-vault-backup-'+new Date().toISOString().slice(0,10)+'.json';
      let dl=null;
      try{dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null}catch{dl=null}
      if(dl){
        try{await dl.save({filename:fname,data:text});toast('書き出しました')}
        catch(er){if(!er||er.code!=='declined')toast('書き出しに失敗しました')}
      }else{
        const blob=new Blob([text],{type:'application/json'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);
        a.download=fname;
        document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
        toast('書き出しました');
      }
      break;}
    case'import':$('#imp').click();break;
    case'wipe':
      if(confirm('すべてのカード情報と設定を削除します。元に戻せません。よろしいですか？')&&confirm('本当に削除しますか？')){
        await dbDel('vault');key=null;vault=null;meta=null;view={name:'setup'};render();}
      break;
  }
  }catch(err){toast('エラーが発生しました')}
});
$('#lb').addEventListener('click',()=>{$('#lb').classList.remove('on');$('#lb img').src=''});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){view.q=t.value;const pos=t.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);}
  else if(t.id==='f-number'){
    const n=t.value.replace(/\D/g,'').slice(0,19);t.value=fmtNum(n);
    if(!view.brandTouched){const b=detect(n);if(b)$('#f-brand').value=b}
  }else if(t.id==='f-exp'){
    let v=t.value.replace(/\D/g,'').slice(0,4);
    if(v.length>=3)v=v.slice(0,2)+'/'+v.slice(2);t.value=v;
  }else if(t.id==='f-cvv'){t.value=t.value.replace(/\D/g,'').slice(0,4)}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='f-brand'){view.brandTouched=true}
  else if(t.id==='pick-front'||t.id==='pick-back'){
    const side=t.id==='pick-front'?'front':'back',f=t.files[0];t.value='';
    if(!f)return;
    try{view.draft[side]=await fileToDataURL(f);render();}catch{toast('画像を読み込めませんでした')}
  }else if(t.id==='imp'){
    const f=t.files[0];t.value='';if(!f)return;
    try{
      const rec=JSON.parse(await f.text());
      if(!rec||typeof rec.salt!=='string'||typeof rec.iv!=='string'||typeof rec.ct!=='string'||!Number.isInteger(rec.iter)||rec.iter<100000||rec.iter>3000000)throw 0;
      if(!confirm('現在のデータをバックアップの内容で置き換えます。読み込み後は、バックアップ作成時のパスワードが必要になります。続行しますか？'))return;
      await dbSet('vault',{v:1,salt:rec.salt,iter:rec.iter,iv:rec.iv,ct:rec.ct});
      lock();toast('読み込みました。バックアップのパスワードで解除してください');
    }catch{toast('バックアップファイルが正しくありません')}
  }
});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const id=e.target.id;
  try{
  if(id==='setupform'){
    const a=$('#pw1').value,b=$('#pw2').value;
    if(a.length<8)return setErr('8文字以上にしてください');
    if(a!==b)return setErr('確認用パスワードが一致しません');
    const btn=$('#setupbtn');btn.disabled=true;btn.textContent='鍵を生成中…';
    meta={salt:crypto.getRandomValues(new Uint8Array(16)),iter:ITER};
    key=await derive(a,meta.salt,meta.iter);vault={cards:[]};await persist();
    view={name:'list',q:''};bump();render();
  }else if(id==='unlockform'){
    const wait=lockUntil-Date.now();
    if(wait>0)return setErr(Math.ceil(wait/1000)+'秒後にもう一度お試しください');
    const pw=$('#pw').value,btn=$('#unlockbtn');
    btn.disabled=true;btn.textContent='確認中…';
    try{
      const rec=await dbGet('vault');
      const salt=unb64(rec.salt),k=await derive(pw,salt,rec.iter);
      const v=await open(k,rec);
      key=k;meta={salt,iter:rec.iter};vault=v;fails=0;view={name:'list',q:''};bump();render();
    }catch{
      fails++;lockUntil=Date.now()+Math.min(fails*2000,30000);
      btn.disabled=false;btn.textContent='ロック解除';$('#pw').value='';
      setErr('パスワードが違います');
    }
  }else if(id==='cardform'){
    collectForm();const d=view.draft;
    if(!d.name)return setErr('カード名を入力してください');
    if(d.number&&(d.number.length<12||d.number.length>19))return setErr('カード番号は12〜19桁で入力してください');
    if(d.exp&&!/^(0[1-9]|1[0-2])\/\d{2}$/.test(d.exp))return setErr('有効期限は MM/YY 形式で入力してください');
    if(d.cvv&&(d.cvv.length<3))return setErr('セキュリティコードは3〜4桁です');
    let id2=view.id;
    if(id2){Object.assign(curCard(),d,{updated:Date.now()})}
    else{id2=rid();vault.cards.push({id:id2,...d,updated:Date.now()})}
    await persist();view={name:'detail',id:id2,reveal:{}};render();toast('保存しました');
  }else if(id==='pwform'){
    const cur=$('#cur').value,n1=$('#n1').value,n2=$('#n2').value;
    if(n1.length<8)return setErr('新しいパスワードは8文字以上にしてください');
    if(n1!==n2)return setErr('確認用パスワードが一致しません');
    const btn=$('#pwbtn');btn.disabled=true;btn.textContent='処理中…';
    try{
      const rec=await dbGet('vault');
      const k=await derive(cur,unb64(rec.salt),rec.iter);await open(k,rec);
      meta={salt:crypto.getRandomValues(new Uint8Array(16)),iter:ITER};
      key=await derive(n1,meta.salt,meta.iter);await persist();
      toast('パスワードを変更しました');view={name:'list',q:''};render();
    }catch{btn.disabled=false;btn.textContent='変更する';setErr('現在のパスワードが違います')}
  }
  }catch(err){toast('エラーが発生しました')}
});

/* ====== 起動 ====== */
(async()=>{
  if(!window.crypto||!crypto.subtle||!window.indexedDB){
    $('#app').innerHTML='<div class="center"><h1>非対応の環境です</h1><p class="sub">Web Crypto と IndexedDB が使えるブラウザ（Chrome / Edge / Safari / Firefox の最新版）で開いてください。</p></div>';return;
  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
  try{const rec=await dbGet('vault');view={name:rec?'lock':'setup'}}catch{view={name:'setup'}}
  render();
})();
</script>
</body>
</html>
